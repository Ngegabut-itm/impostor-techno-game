# ==============================================================================
# IMPOSTOR TECHNO - APACHE REVERSE PROXY VIRTUALHOST CONFIGURATION (XAMPP WINDOWS)
# ==============================================================================
# File ini dirancang untuk diletakkan / di-include pada:
# C:\xampp\apache\conf\extra\httpd-vhosts.conf
#
# Pastikan modul-modul berikut telah diaktifkan (uncomment '#' di httpd.conf):
#   LoadModule proxy_module modules/mod_proxy.so
#   LoadModule proxy_http_module modules/mod_proxy_http.so
#   LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
#   LoadModule rewrite_module modules/mod_rewrite.so
# ==============================================================================

<VirtualHost *:80>
    ServerName localhost
    # Masukkan IP LAN kantor Anda di sini (misal: 192.168.1.18 atau domain lokal)
    ServerAlias 127.0.0.1 192.168.* game.kantor.local

    DocumentRoot "c:/GAME/impostor_techno/public"

    # Akses direktori frontend
    <Directory "c:/GAME/impostor_techno/public">
        Options FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # --------------------------------------------------------------------------
    # 1. WEBSOCKET REVERSE PROXY (SOCKET.IO) KE NODE.JS BACKEND
    # --------------------------------------------------------------------------
    # CATATAN: Gunakan port 3001 jika port 3000 sedang terpakai (default fallback PM2 saat ini: 3001)
    RewriteEngine On

    # Meneruskan handshake upgrade WebSocket
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/socket.io/(.*) ws://127.0.0.1:3001/socket.io/$1 [P,L]

    # Meneruskan HTTP Polling fallback Socket.io
    ProxyPass /socket.io/ http://127.0.0.1:3001/socket.io/
    ProxyPassReverse /socket.io/ http://127.0.0.1:3001/socket.io/

    # Meneruskan API status / room check ke backend jika ada
    ProxyPass /api/ http://127.0.0.1:3001/api/
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/

    # --------------------------------------------------------------------------
    # 2. OPTIONAL: FULL REVERSE PROXY MODE (Jika ingin seluruh request disajikan Node.js)
    # --------------------------------------------------------------------------
    # Jika ingin Apache bertindak 100% sebagai Reverse Proxy murni:
    # ProxyPreserveHost On
    # ProxyPass / http://127.0.0.1:3000/
    # ProxyPassReverse / http://127.0.0.1:3000/

    # Logging
    ErrorLog "logs/impostor_techno_error.log"
    CustomLog "logs/impostor_techno_access.log" combined
</VirtualHost>
